name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates and keystore
        run: |
          echo "HOME=$HOME GODOT_VERSION=$GODOT_VERSION"
          ls -d /root/.local/share/godot/export_templates/* || true
          mkdir -p $HOME/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* $HOME/.local/share/godot/export_templates/ || true
          ls $HOME/.local/share/godot/export_templates/*
          JDK=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JDK=$JDK"
          mkdir -p $HOME/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $PWD/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/debug_keystore = \"$PWD/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"'
            echo "export/android/java_sdk_path = \"$JDK\""
          } > $HOME/.config/godot/editor_settings-4.tres
      - name: Export APK
        run: |
          mkdir -p build
          SM=$(find / -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDKMANAGER=$SM"
          ls /usr/lib/android-sdk/build-tools
          yes | $SM --sdk_root=/usr/lib/android-sdk --licenses > /dev/null || true
          $SM --sdk_root=/usr/lib/android-sdk "platforms;android-34" "build-tools;34.0.0" || true
          ls /usr/lib/android-sdk/platforms /usr/lib/android-sdk/build-tools
          ls /usr/lib/android-sdk /usr/lib/android-sdk/platforms /usr/lib/android-sdk/build-tools || true
          ln -sfn /usr/lib/android-sdk/cmdline-tools/cmdline-tools /usr/lib/android-sdk/cmdline-tools/latest
          ls /usr/lib/android-sdk/cmdline-tools
          godot --headless --verbose --import || true
          echo "=== SETTINGS FILE"
          grep -i -E "android|java|keystore" $HOME/.config/godot/editor_settings-4.tres || echo "NO ANDROID SETTINGS"
          echo "=== TEMPLATES"
          ls -la $HOME/.local/share/godot/export_templates/4.3.stable | head
          godot --headless --verbose --export-debug "Android" build/realm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: realm-apk
          path: build/realm.apk
